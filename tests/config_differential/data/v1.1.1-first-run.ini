; What Remains of Edith Finch Head Tracking - configuration
; Edit values, restart the game to apply.

[Network]
UdpPort=4242

[General]
EnableOnStartup=1
; Yaw mode: 1 = horizon-locked yaw about the world up-axis (default),
; 0 = yaw about the camera's own up-axis. Toggle in-game with Page Down.
WorldSpaceYaw=1

[Hotkeys]
; Virtual-key code for the yaw-mode toggle. 0x22 = Page Down.
; The Ctrl+Shift+H chord always toggles it as well.
YawModeKey=0x22

[Rotation]
YawSensitivity=1.0
PitchSensitivity=1.0
RollSensitivity=1.0
InvertYaw=0
InvertPitch=0
InvertRoll=0
; Smoothing applied when the tracker runs on this machine (loopback).
; 0 = no smoothing, 1 = heavy. Covers rotation and position.
LocalSmoothing=0.0
; Smoothing applied when the tracker is a remote device on the network.
; 0 = no smoothing, 1 = heavy. Covers rotation and position.
RemoteSmoothing=0.15

[View]
; Degrees added to the game's own field of view. 0 = untouched.
; The game ships no FOV setting and authors a value per camera (every
; view measured so far runs at 80), so this widens or narrows what the
; game asks for instead of pinning one number over the top - a chapter
; that picks its own framing keeps it. The result is capped at 170.
; Try 10 to 20 for a wider view; head tracking stays 1:1 with your head
; at any FOV. HeadTracking.log reports the game's value and any change.
FovOffset=0.0

[Position]
Enabled=1
SensitivityX=1.0
SensitivityY=1.0
SensitivityZ=1.0
LimitX=0.30
LimitY=0.20
LimitZ=0.40
LimitZBack=0.10
